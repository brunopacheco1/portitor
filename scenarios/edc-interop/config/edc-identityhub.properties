#
# EDC IdentityHub (v1.0.0-RC8) of the EDC interop test. Ports and paths as
# in EDC's Minimum Viable Dataspace. Test-only: plain HTTP, a dev Vault.

web.http.port=7080
web.http.path=/api
web.http.identity.port=7081
web.http.identity.path=/api/identity
web.http.credentials.port=7082
web.http.credentials.path=/api/credentials
web.http.did.port=7083
web.http.did.path=/
web.http.sts.port=7084
web.http.sts.path=/api/sts

# did:web DIDs of the test are served over plain HTTP
edc.iam.did.web.use.https=false

edc.vault.hashicorp.url=http://vault:8200
edc.vault.hashicorp.token=root

# the Identity API takes tokens that scenarios/edc-interop/run.sh signs with a
# test-only RSA key (identity_api_token); its key set is on the
# identity-api-jwks web server
edc.iam.oauth2.issuer=edc-interop-admin
edc.iam.oauth2.jwks.url=http://identity-api-jwks/jwks.json

# Gaia-X credential types are compact IRIs (gx:ParticipantComplianceCredential),
# and a scope cannot hold a colon inside its type
# (EdcScopeToCriterionTransformer splits at the first and the last colon,
# so it would read the type with its "gx:" prefix only by accident). These
# two aliases (DiscriminatorMappingExtension) say which stored type a scope
# type stands for, the rule Portitor applies itself (ADR 0021, "Credential
# types and scopes"):
#   org.eclipse.dspace.dcp.vc.type:ParticipantComplianceCredential:read
#     -> credentials whose type contains gx:ParticipantComplianceCredential
edc.identityhub.discriminator.gaiaxcompliance.alias=ParticipantComplianceCredential
edc.identityhub.discriminator.gaiaxcompliance.value=gx:ParticipantComplianceCredential
edc.identityhub.discriminator.gaiaxlegalperson.alias=LegalPerson
edc.identityhub.discriminator.gaiaxlegalperson.value=gx:LegalPerson
