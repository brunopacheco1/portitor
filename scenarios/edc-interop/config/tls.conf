#
# The EDC interop test's front door (compose.yaml, service "tls"): the
# public names of the services whose did:web the others resolve. One
# server certificate from the run's test CA covers every name.
#
# Port 443: the Gaia-X compliance service resolves did:web over HTTPS only.
# Port 80: the Portitor components (PORTITOR_ALLOW_HTTP) and the
# EDC runtimes (edc.iam.did.web.use.https=false) resolve did:web over plain
# HTTP; both ports serve the same.

# the container's resolver, so a service that is not up yet does not stop nginx.
# This file is a template of the nginx image (compose.yaml mounts it in
# /etc/nginx/templates): at start the entrypoint replaces
# ${NGINX_LOCAL_RESOLVERS}, and only that, with the name servers of
# /etc/resolv.conf (NGINX_ENTRYPOINT_LOCAL_RESOLVERS). Docker's is
# 127.0.0.11; Podman's is the network's gateway.
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

map $host $backend {
    portitor.gaiax.test http://portitor-identity:8090;
    compliance.gaiax.test http://compliance:3000;
}

# the Portitor participant's identity and the compliance service
server {
    listen 80;
    listen 443 ssl;
    server_name portitor.gaiax.test compliance.gaiax.test;
    ssl_certificate /tls/server.pem;
    ssl_certificate_key /tls/server-key.pem;
    client_max_body_size 1m;

    location / {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# the EDC participant: its DID document comes from the EDC IdentityHub,
# which finds it by the Host header (DidWebController). The IdentityHub
# serves nothing else of Gaia-X, so the certificate chain of the
# participant's key (x5u) and its Gaia-X credentials are static files
# written by scenarios/edc-interop/run.sh.
server {
    listen 80;
    listen 443 ssl;
    server_name edc.gaiax.test;
    ssl_certificate /tls/server.pem;
    ssl_certificate_key /tls/server-key.pem;

    location = /.well-known/x509CertificateChain.pem {
        root /edc;
        types { }
        default_type application/x-pem-file;
    }
    location /credentials/gaiax/ {
        root /edc;
        types { }
        default_type application/vc+jwt;
    }
    location / {
        set $identityhub http://edc-identityhub:7083;
        proxy_pass $identityhub;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# the EDC Issuer Service: its DID document, found by the Host header as
# the IdentityHub's
server {
    listen 80;
    listen 443 ssl;
    server_name edc-issuer.gaiax.test;
    ssl_certificate /tls/server.pem;
    ssl_certificate_key /tls/server-key.pem;

    location / {
        set $issuerservice http://edc-issuerservice:9083;
        proxy_pass $issuerservice;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# the test notary: its DID document and certificate chain, static files
# written by scenarios/edc-interop/run.sh (scripts/gaiax_test_notary.py)
server {
    listen 80;
    listen 443 ssl;
    server_name notary.gaiax.test;
    ssl_certificate /tls/server.pem;
    ssl_certificate_key /tls/server-key.pem;
    root /notary;
    types {
        application/did+json json;
        application/x-pem-file pem;
    }
}
