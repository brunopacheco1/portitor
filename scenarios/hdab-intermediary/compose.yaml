#
# The hdab-intermediary scenario (README.md): a Luxembourg-style health
# data space with its authority and four participants, each in its own
# containers. run.sh writes the keys and secrets into run/, starts
# everything, has each participant get its credentials and runs steps.sh.
# Not a production setup: plain HTTP between the containers
# (PORTITOR_ALLOW_HTTP), all parties on one machine.
#
# Who is who (made-up organisations, modelled on real ones: README.md):
#   authority  Digital Lux Trust, the data space authority: issues the
#              credentials and the HealthDCAT-AP bundle
#              (did:web:authority%3A8070)
#   biobank    Lux Biobank, the health data holder: offers synthetic
#              genotypes (biobank-data serves examples/genotypes/)
#   lab        Lux Biomedicine Lab, a data user that takes the genotypes
#              peer to peer: Lux Biobank pushes them to the lab's
#              connector, which stores them in the lab's own object
#              storage (lab-storage, RustFS, bucket lab-genotypes;
#              ADR 0027, connector 1.1)
#   hdab       the HDAB: takes the genotypes for the access body and
#              offers counts made from them by its pipeline
#   schuman    Schuman Clinical Research, a data user that takes the
#              counts from the HDAB
# Each participant is a connector and its identity component; the DID is
# did:web:<participant>-identity%3A8090.
#
# schuman-app is Schuman's own app: it fetches the counts of a started
# transfer with its token. It runs only when steps.sh calls it (profile
# apps).
#
# The lab's object storage keys are made by run.sh for each run and
# passed as LAB_S3_ACCESS_KEY and LAB_S3_SECRET_KEY, to RustFS and to the
# lab's connector (AWS_* settings, ADR 0027). Push needs connector images
# from 1.1 on: the 1.0.0 default below does not have it.
#
# PORTITOR_IMAGE, PORTITOR_IDENTITY_IMAGE and PORTITOR_ISSUER_IMAGE pick
# other images, for example local builds. Start order and health checks
# as in ../two-party/compose.yaml. The host ports are those of
# ../data-permits/compose.yaml: run one scenario at a time.

name: portitor-hdab-intermediary

x-identity: &identity
  image: ${PORTITOR_IDENTITY_IMAGE:-ghcr.io/brunopacheco1/portitor-identity:1.1.0}
  depends_on:
    authority:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/portitor-identity", "health"]
    interval: 2s
    timeout: 5s
    retries: 30
x-connector: &connector
  image: ${PORTITOR_IMAGE:-ghcr.io/brunopacheco1/portitor-connector:1.1.0}
  # should a start still fail, it is tried again
  restart: on-failure
x-app: &app
  image: docker.io/library/python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
  profiles: [apps]

services:
  # Digital Lux Trust: did:web:authority%3A8070, its issuer service and its
  # management API, where run.sh registers the participants
  authority:
    image: ${PORTITOR_ISSUER_IMAGE:-ghcr.io/brunopacheco1/portitor-issuer:1.1.0}
    environment:
      PORTITOR_PARTICIPANT_ID: did:web:authority%3A8070
      PORTITOR_ISSUER_SERVICE_URL: http://authority:8070/issuer
      PORTITOR_ISSUER_KEY_FILE: /run/secrets/authority-key
      # MembershipCredential (claims memberOf, role) and
      # DataProcessorCredential (claim processing)
      PORTITOR_ISSUER_CREDENTIAL_DEFINITIONS_FILE: /config/issuer-credentials.json
      PORTITOR_MANAGEMENT_BIND: 0.0.0.0:8071
      PORTITOR_MANAGEMENT_API_KEY_FILE: /run/secrets/authority-management-key
      PORTITOR_ALLOW_HTTP: "true"
      # the HealthDCAT-AP bundle, as in ../two-party/compose.yaml
      PORTITOR_ISSUER_BUNDLE_KEY_FILE: /config/bundle/bundle-key.jwk
      PORTITOR_ISSUER_BUNDLE_DIR: /config/bundle/bundles
    secrets:
      - authority-key
      - authority-management-key
    volumes:
      - ../../examples/issuer-credentials.json:/config/issuer-credentials.json:ro
      - ./run/authority/bundle:/config/bundle:ro
      - authority-data:/data
    ports:
      - 127.0.0.1:18071:8071 # management API
    healthcheck:
      test: ["CMD", "/portitor-issuer", "health"]
      interval: 2s
      timeout: 5s
      retries: 30

  # --- Lux Biobank: the health data holder -----------------------------------

  # its data: a plain web server with examples/genotypes/ (genotypes.vcf)
  biobank-data:
    image: docker.io/library/nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    volumes:
      - ../../examples/genotypes:/usr/share/nginx/html:ro

  biobank-identity:
    <<: *identity
    environment:
      PORTITOR_PARTICIPANT_ID: did:web:biobank-identity%3A8090
      PORTITOR_IDENTITY_KEY_FILE: /run/secrets/biobank-identity-key
      PORTITOR_CREDENTIAL_SERVICE_URL: http://biobank-identity:8090/cs
      PORTITOR_STS_CLIENT_SECRET_FILE: /run/secrets/biobank-sts-secret
      PORTITOR_TRUSTED_ISSUERS: did:web:authority%3A8070
      PORTITOR_MANAGEMENT_BIND: 0.0.0.0:8091
      PORTITOR_MANAGEMENT_API_KEY_FILE: /run/secrets/biobank-identity-management-key
      PORTITOR_ALLOW_HTTP: "true"
    secrets:
      - biobank-identity-key
      - biobank-sts-secret
      - biobank-identity-management-key
    volumes:
      - biobank-identity-data:/data
    ports:
      - 127.0.0.1:18103:8091 # management API

  biobank:
    <<: *connector
    environment:
      PORTITOR_PARTICIPANT_ID: did:web:biobank-identity%3A8090
      PORTITOR_STS_URL: http://biobank-identity:8090/sts/token
      PORTITOR_STS_CLIENT_SECRET_FILE: /run/secrets/biobank-sts-secret
      PORTITOR_TRUSTED_ISSUERS: did:web:authority%3A8070
      # status lists fetched on every check, so a revocation is seen at once
      PORTITOR_STATUS_LIST_CACHE_SECONDS: "0"
      # where data addresses point: the apps reach it in this network
      PORTITOR_PUBLIC_URL: http://biobank:8080
      # offers may check DataProcessorCredential claims (ADR 0019)
      PORTITOR_POLICY_CREDENTIALS: DataProcessorCredential
      PORTITOR_ALLOW_HTTP: "true"
      PORTITOR_MANAGEMENT_BIND: 0.0.0.0:8081
      PORTITOR_MANAGEMENT_API_KEY_FILE: /run/secrets/biobank-management-key
      # HealthDCAT-AP datasets, checked against the data space's bundle
      PORTITOR_DATASETS_FILE: /config/datasets.json
      PORTITOR_BUNDLE_URL: http://authority:8070/bundles/
      PORTITOR_BUNDLE_AUTHORITY: did:web:authority%3A8070
    secrets:
      - biobank-sts-secret
      - biobank-management-key
    volumes:
      - biobank-data:/data
      - ./datasets/biobank.json:/config/datasets.json:ro
    ports:
      - 127.0.0.1:18101:8081 # management API
    depends_on:
      biobank-identity:
        condition: service_healthy
      # the bundle is read at start
      authority:
        condition: service_healthy
      biobank-data:
        condition: service_started

  # --- Lux Biomedicine Lab: a data user, peer to peer ------------------------

  lab-identity:
    <<: *identity
    environment:
      PORTITOR_PARTICIPANT_ID: did:web:lab-identity%3A8090
      PORTITOR_IDENTITY_KEY_FILE: /run/secrets/lab-identity-key
      PORTITOR_CREDENTIAL_SERVICE_URL: http://lab-identity:8090/cs
      PORTITOR_STS_CLIENT_SECRET_FILE: /run/secrets/lab-sts-secret
      PORTITOR_TRUSTED_ISSUERS: did:web:authority%3A8070
      PORTITOR_MANAGEMENT_BIND: 0.0.0.0:8091
      PORTITOR_MANAGEMENT_API_KEY_FILE: /run/secrets/lab-identity-management-key
      PORTITOR_ALLOW_HTTP: "true"
    secrets:
      - lab-identity-key
      - lab-sts-secret
      - lab-identity-management-key
    volumes:
      - lab-identity-data:/data
    ports:
      - 127.0.0.1:18113:8091 # management API

  lab:
    <<: *connector
    environment:
      PORTITOR_PARTICIPANT_ID: did:web:lab-identity%3A8090
      PORTITOR_STS_URL: http://lab-identity:8090/sts/token
      PORTITOR_STS_CLIENT_SECRET_FILE: /run/secrets/lab-sts-secret
      PORTITOR_TRUSTED_ISSUERS: did:web:authority%3A8070
      # status lists fetched on every check, so a revocation is seen at once
      PORTITOR_STATUS_LIST_CACHE_SECONDS: "0"
      # where data addresses point: the apps reach it in this network
      PORTITOR_PUBLIC_URL: http://lab:8080
      # offers may check DataProcessorCredential claims, and data users
      # show it when asked (ADR 0019)
      PORTITOR_POLICY_CREDENTIALS: DataProcessorCredential
      PORTITOR_ALLOW_HTTP: "true"
      PORTITOR_MANAGEMENT_BIND: 0.0.0.0:8081
      PORTITOR_MANAGEMENT_API_KEY_FILE: /run/secrets/lab-management-key
      # its object storage, where pushed data lands (ADR 0027). A demo:
      # in production the keys come from a secret store (docs/DEPLOYING.md)
      AWS_ENDPOINT_URL_S3: http://lab-storage:9000
      AWS_ACCESS_KEY_ID: ${LAB_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${LAB_S3_SECRET_KEY:-}
      PORTITOR_PUSH_BUCKET: lab-genotypes
    secrets:
      - lab-sts-secret
      - lab-management-key
    volumes:
      - lab-data:/data
    ports:
      - 127.0.0.1:18111:8081 # management API
    depends_on:
      lab-identity:
        condition: service_healthy
      lab-storage:
        condition: service_started

  # its object storage: RustFS, S3 API on :9000. The lab's connector
  # stores what Lux Biobank pushes in bucket lab-genotypes; steps.sh
  # creates the bucket and reads the object back on 127.0.0.1:18114
  lab-storage:
    image: docker.io/rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: ${LAB_S3_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${LAB_S3_SECRET_KEY:-}
    volumes:
      - lab-storage-data:/data
    ports:
      - 127.0.0.1:18114:9000 # S3 API, for the checks

  # --- the HDAB: the health data access body ---------------------------------

  hdab-identity:
    <<: *identity
    environment:
      PORTITOR_PARTICIPANT_ID: did:web:hdab-identity%3A8090
      PORTITOR_IDENTITY_KEY_FILE: /run/secrets/hdab-identity-key
      PORTITOR_CREDENTIAL_SERVICE_URL: http://hdab-identity:8090/cs
      PORTITOR_STS_CLIENT_SECRET_FILE: /run/secrets/hdab-sts-secret
      PORTITOR_TRUSTED_ISSUERS: did:web:authority%3A8070
      PORTITOR_MANAGEMENT_BIND: 0.0.0.0:8091
      PORTITOR_MANAGEMENT_API_KEY_FILE: /run/secrets/hdab-identity-management-key
      PORTITOR_ALLOW_HTTP: "true"
    secrets:
      - hdab-identity-key
      - hdab-sts-secret
      - hdab-identity-management-key
    volumes:
      - hdab-identity-data:/data
    ports:
      - 127.0.0.1:18123:8091 # management API

  hdab:
    <<: *connector
    environment:
      PORTITOR_PARTICIPANT_ID: did:web:hdab-identity%3A8090
      PORTITOR_STS_URL: http://hdab-identity:8090/sts/token
      PORTITOR_STS_CLIENT_SECRET_FILE: /run/secrets/hdab-sts-secret
      PORTITOR_TRUSTED_ISSUERS: did:web:authority%3A8070
      # status lists fetched on every check, so a revocation is seen at once
      PORTITOR_STATUS_LIST_CACHE_SECONDS: "0"
      # where data addresses point: the apps reach it in this network
      PORTITOR_PUBLIC_URL: http://hdab:8080
      # offers may check DataProcessorCredential claims, and data users
      # show it when asked (ADR 0019)
      PORTITOR_POLICY_CREDENTIALS: DataProcessorCredential
      PORTITOR_ALLOW_HTTP: "true"
      PORTITOR_MANAGEMENT_BIND: 0.0.0.0:8081
      PORTITOR_MANAGEMENT_API_KEY_FILE: /run/secrets/hdab-management-key
      # HealthDCAT-AP datasets, checked against the data space's bundle
      PORTITOR_DATASETS_FILE: /config/datasets.json
      PORTITOR_BUNDLE_URL: http://authority:8070/bundles/
      PORTITOR_BUNDLE_AUTHORITY: did:web:authority%3A8070
    secrets:
      - hdab-sts-secret
      - hdab-management-key
    volumes:
      - hdab-data:/data
      # datasets/hdab.json, with the pilot offer run.sh adds
      - ./run/hdab/datasets.json:/config/datasets.json:ro
    ports:
      - 127.0.0.1:18121:8081 # management API
    depends_on:
      hdab-identity:
        condition: service_healthy
      # the bundle is read at start
      authority:
        condition: service_healthy

  # its pipeline: the source of the counts dataset (pipeline/counts.py).
  # On each fetch it pulls the genotypes from Lux Biobank through the
  # HDAB's connector, under the agreement in run/pipeline/agreement
  pipeline:
    image: docker.io/library/python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
    user: "65532"
    command: ["python", "/app/counts.py"]
    environment:
      HDAB_MANAGEMENT: http://hdab:8081
      HDAB_KEY_FILE: /run/secrets/hdab-management-key
      AGREEMENT_FILE: /config/agreement
      PYTHONDONTWRITEBYTECODE: "1"
    secrets:
      - hdab-management-key
    volumes:
      - ./pipeline/counts.py:/app/counts.py:ro
      - ./run/pipeline:/config:ro

  # --- Schuman Clinical Research: a data user, through the HDAB --------------

  schuman-identity:
    <<: *identity
    environment:
      PORTITOR_PARTICIPANT_ID: did:web:schuman-identity%3A8090
      PORTITOR_IDENTITY_KEY_FILE: /run/secrets/schuman-identity-key
      PORTITOR_CREDENTIAL_SERVICE_URL: http://schuman-identity:8090/cs
      PORTITOR_STS_CLIENT_SECRET_FILE: /run/secrets/schuman-sts-secret
      PORTITOR_TRUSTED_ISSUERS: did:web:authority%3A8070
      PORTITOR_MANAGEMENT_BIND: 0.0.0.0:8091
      PORTITOR_MANAGEMENT_API_KEY_FILE: /run/secrets/schuman-identity-management-key
      PORTITOR_ALLOW_HTTP: "true"
    secrets:
      - schuman-identity-key
      - schuman-sts-secret
      - schuman-identity-management-key
    volumes:
      - schuman-identity-data:/data
    ports:
      - 127.0.0.1:18133:8091 # management API

  schuman:
    <<: *connector
    environment:
      PORTITOR_PARTICIPANT_ID: did:web:schuman-identity%3A8090
      PORTITOR_STS_URL: http://schuman-identity:8090/sts/token
      PORTITOR_STS_CLIENT_SECRET_FILE: /run/secrets/schuman-sts-secret
      PORTITOR_TRUSTED_ISSUERS: did:web:authority%3A8070
      # status lists fetched on every check, so a revocation is seen at once
      PORTITOR_STATUS_LIST_CACHE_SECONDS: "0"
      # where data addresses point: the apps reach it in this network
      PORTITOR_PUBLIC_URL: http://schuman:8080
      # offers may check DataProcessorCredential claims, and data users
      # show it when asked (ADR 0019)
      PORTITOR_POLICY_CREDENTIALS: DataProcessorCredential
      PORTITOR_ALLOW_HTTP: "true"
      PORTITOR_MANAGEMENT_BIND: 0.0.0.0:8081
      PORTITOR_MANAGEMENT_API_KEY_FILE: /run/secrets/schuman-management-key
    secrets:
      - schuman-sts-secret
      - schuman-management-key
    volumes:
      - schuman-data:/data
    ports:
      - 127.0.0.1:18131:8081 # management API
    depends_on:
      schuman-identity:
        condition: service_healthy

  # its app: fetches the counts
  schuman-app:
    <<: *app

# written by run.sh; the images run as user 65532, which must read them
secrets:
  authority-key:
    file: ./run/authority/issuer-key.pem
  authority-management-key:
    file: ./run/authority/management.key
  biobank-identity-key:
    file: ./run/biobank/identity-key.pem
  biobank-sts-secret:
    file: ./run/biobank/sts-client-secret
  biobank-identity-management-key:
    file: ./run/biobank/identity-management.key
  biobank-management-key:
    file: ./run/biobank/management.key
  lab-identity-key:
    file: ./run/lab/identity-key.pem
  lab-sts-secret:
    file: ./run/lab/sts-client-secret
  lab-identity-management-key:
    file: ./run/lab/identity-management.key
  lab-management-key:
    file: ./run/lab/management.key
  hdab-identity-key:
    file: ./run/hdab/identity-key.pem
  hdab-sts-secret:
    file: ./run/hdab/sts-client-secret
  hdab-identity-management-key:
    file: ./run/hdab/identity-management.key
  hdab-management-key:
    file: ./run/hdab/management.key
  schuman-identity-key:
    file: ./run/schuman/identity-key.pem
  schuman-sts-secret:
    file: ./run/schuman/sts-client-secret
  schuman-identity-management-key:
    file: ./run/schuman/identity-management.key
  schuman-management-key:
    file: ./run/schuman/management.key

volumes:
  authority-data:
  biobank-identity-data:
  biobank-data:
  lab-identity-data:
  lab-data:
  lab-storage-data:
  hdab-identity-data:
  hdab-data:
  schuman-identity-data:
  schuman-data:
