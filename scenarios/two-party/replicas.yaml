#
# The provider as two connector containers behind nginx (ADR 0029): an
# override for compose.yaml, for the test the maintainer runs before a
# release (docs/TESTING.md, "Two connectors behind nginx"). Needs images
# from 1.3 on, which keep their state in PostgreSQL.
#
#   EXTRA_COMPOSE=scenarios/two-party/replicas.yaml scenarios/two-party/run.sh \
#     portitor-connector:ci portitor-identity:ci portitor-issuer:ci
#
# provider-1 and provider-2 are the provider of compose.yaml, with the same
# settings and the same database; each has its own /data volume (its
# bundle cache stays per container). The service "provider" becomes nginx:
# it keeps the name, the address the consumer negotiates with
# (http://provider:8080) and the host ports, and sends each request to
# the next connector in turn (round robin; a connector that does not
# answer is skipped). No sticky sessions: any connector serves any request.
# Needs Docker Compose 2.24 or later (!reset, !override).

services:
  provider:
    image: docker.io/library/nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    environment: !reset {}
    secrets: !reset []
    volumes: !override
      - ./replicas-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: !override
      provider-1:
        condition: service_healthy
      provider-2:
        condition: service_healthy

  provider-1:
    extends:
      file: compose.yaml
      service: provider
    ports: !reset []
    volumes: !override
      - ./run/datasets.json:/config/datasets.json:ro
      - provider-1-data:/data
    healthcheck:
      test: ["CMD", "/portitor-connector", "health"]
      interval: 2s
      timeout: 5s
      retries: 30

  provider-2:
    extends:
      file: compose.yaml
      service: provider
    ports: !reset []
    volumes: !override
      - ./run/datasets.json:/config/datasets.json:ro
      - provider-2-data:/data
    healthcheck:
      test: ["CMD", "/portitor-connector", "health"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  provider-1-data:
  provider-2-data:
