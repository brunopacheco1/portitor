#
# nginx in front of the provider's two connectors (replicas.yaml): round
# robin, per request. On a connection error or a timeout nginx tries the
# other connector (proxy_next_upstream, its default). max_fails=0: a
# connector that failed is still tried on the next request, so one that
# starts again is used at once.

upstream provider_public {
    server provider-1:8080 max_fails=0;
    server provider-2:8080 max_fails=0;
}

upstream provider_management {
    server provider-1:8081 max_fails=0;
    server provider-2:8081 max_fails=0;
}

# DSP and the data plane
server {
    listen 8080;
    client_max_body_size 0;
    location / {
        proxy_pass http://provider_public;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # data flows through as it comes
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# the management API (harvest jobs, provided transfers)
server {
    listen 8081;
    location / {
        proxy_pass http://provider_management;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }
}
