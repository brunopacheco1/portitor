#
# Two Portitor participants and a data source, for trying Portitor out.
# Each participant is a connector and its identity component
# (portitor-identity). DSP requests are authenticated with DCP: the
# caller shows a MembershipCredential from a trusted issuer, here the
# dataspace's portitor-issuer (did:web:issuer%3A8070). Not a production setup:
# plain HTTP between the containers (PORTITOR_ALLOW_HTTP), and
# the issuer next to the participants. The issuer also serves the
# dataspace's HealthDCAT-AP demo bundle (scripts/demo-bundle.sh), which the
# provider follows and checks its datasets (../../examples/healthdcat-datasets.json)
# against.
#
#   scenarios/two-party/run.sh
#
# writes the keys and secrets into run/, builds and signs the demo bundle
# into run/issuer/bundle/ (with the issuer image), starts everything, registers both
# participants at the issuer, has each identity ask it for its credentials
# and runs the demo checks (scenarios/two-party/steps.sh). KEEP=1 leaves it
# running: then use the consumer's management API on
# http://127.0.0.1:18091 (docs/DEPLOYING.md, "Management API"), with the key in
# run/consumer/management.key, and negotiate with the provider at
# http://provider:8080/dsp/2025-1. The issuer's management API is on
# http://127.0.0.1:18071, with the key in run/issuer/management.key; the
# provider's (harvest jobs) on http://127.0.0.1:18081, with the key in
# run/provider/management.key.
# PORTITOR_IMAGE, PORTITOR_IDENTITY_IMAGE and PORTITOR_ISSUER_IMAGE pick
# other images, for example local builds.
#
# With S3=1 (connector images from 1.1 on), run.sh also starts the profile
# "s3": a RustFS object store shared by both participants (bucket
# provider-data for the provider's sources, consumer-push for the data
# pushed to the consumer, ADR 0027). run.sh makes its keys and passes them
# as DEMO_S3_ACCESS_KEY and DEMO_S3_SECRET_KEY; without them the
# connectors have no object storage.
#
# Start order: the deployment order (DEPLOYING). The issuer starts first;
# each identity once the issuer is healthy; each connector once its own
# identity (and, for the provider, the issuer, which serves the bundle) is
# healthy. "Healthy" is `<binary> health`, the component's own
# GET /api/check/readiness on its management port (ADR 0023), which needs
# images from 0.9 on. The check is written here (healthcheck:) and not
# left to the image's HEALTHCHECK, which Podman does not read from an
# image in OCI format (docs/TESTING.md, "Docker or Podman").

name: portitor-demo

# shared by both participants
x-identity: &identity
  image: ${PORTITOR_IDENTITY_IMAGE:-ghcr.io/brunopacheco1/portitor-identity:1.1.0}
  depends_on:
    issuer:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/portitor-identity", "health"]
    interval: 2s
    timeout: 5s
    retries: 30
x-connector: &connector
  image: ${PORTITOR_IMAGE:-ghcr.io/brunopacheco1/portitor-connector:1.1.0}

services:
  # The dataspace's authority: did:web:issuer%3A8070, its issuer service
  # (credential requests, status lists) and its management API, where
  # scenarios/two-party/run.sh registers the participants.
  issuer:
    image: ${PORTITOR_ISSUER_IMAGE:-ghcr.io/brunopacheco1/portitor-issuer:1.1.0}
    environment:
      PORTITOR_PARTICIPANT_ID: did:web:issuer%3A8070
      PORTITOR_ISSUER_SERVICE_URL: http://issuer:8070/issuer
      PORTITOR_ISSUER_KEY_FILE: /run/secrets/issuer-key
      # MembershipCredential (claims memberOf, role) and
      # DataProcessorCredential (claim processing)
      PORTITOR_ISSUER_CREDENTIAL_DEFINITIONS_FILE: /config/issuer-credentials.json
      PORTITOR_MANAGEMENT_BIND: 0.0.0.0:8071
      PORTITOR_MANAGEMENT_API_KEY_FILE: /run/secrets/issuer-management-key
      PORTITOR_ALLOW_HTTP: "true"
      # the demo bundle: its public key in the DID document
      # (did:web:issuer%3A8070#bundle-key), the signed versions served at
      # http://issuer:8070/bundles/<version>/, the newest named in
      # http://issuer:8070/bundles/latest.json
      PORTITOR_ISSUER_BUNDLE_KEY_FILE: /config/bundle/bundle-key.jwk
      PORTITOR_ISSUER_BUNDLE_DIR: /config/bundle/bundles
    secrets:
      - issuer-key
      - issuer-management-key
    volumes:
      - ../../examples/issuer-credentials.json:/config/issuer-credentials.json:ro
      - ./run/issuer/bundle:/config/bundle:ro
      - issuer-data:/data
    ports:
      - 127.0.0.1:18071:8071 # management API
    healthcheck:
      test: ["CMD", "/portitor-issuer", "health"]
      interval: 2s
      timeout: 5s
      retries: 30

  # the provider's data: a plain web server with examples/data
  data:
    image: docker.io/library/nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    volumes:
      - ../../examples/data:/usr/share/nginx/html:ro

  # the participants' object storage (profile s3): S3 API on :9000
  rustfs:
    image: docker.io/rustfs/rustfs:1.0.6
    profiles: [s3]
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: ${DEMO_S3_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${DEMO_S3_SECRET_KEY:-}
    volumes:
      - rustfs-data:/data
    ports:
      - 127.0.0.1:18100:9000 # S3 API, for the checks

  # --- the provider ---------------------------------------------------------

  provider-identity:
    <<: *identity
    environment:
      # did:web:provider-identity%3A8090 is served at
      # http://provider-identity:8090/.well-known/did.json
      PORTITOR_PARTICIPANT_ID: did:web:provider-identity%3A8090
      PORTITOR_IDENTITY_KEY_FILE: /run/secrets/provider-identity-key
      PORTITOR_CREDENTIAL_SERVICE_URL: http://provider-identity:8090/cs
      PORTITOR_STS_CLIENT_SECRET_FILE: /run/secrets/provider-sts-secret
      PORTITOR_TRUSTED_ISSUERS: did:web:issuer%3A8070
      PORTITOR_MANAGEMENT_BIND: 0.0.0.0:8091
      PORTITOR_MANAGEMENT_API_KEY_FILE: /run/secrets/provider-identity-management-key
      PORTITOR_ALLOW_HTTP: "true"
    secrets:
      - provider-identity-key
      - provider-sts-secret
      - provider-identity-management-key
    volumes:
      - provider-identity-data:/data
    ports:
      - 127.0.0.1:18082:8090 # DID document, STS, credential service
      - 127.0.0.1:18083:8091 # management API

  provider:
    <<: *connector
    environment:
      # the connector is its identity's participant
      PORTITOR_PARTICIPANT_ID: did:web:provider-identity%3A8090
      PORTITOR_STS_URL: http://provider-identity:8090/sts/token
      PORTITOR_STS_CLIENT_SECRET_FILE: /run/secrets/provider-sts-secret
      PORTITOR_TRUSTED_ISSUERS: did:web:issuer%3A8070
      # status lists fetched on every check, so a revocation in the demo
      # is seen at once (docs/DEPLOYING.md, PORTITOR_STATUS_LIST_CACHE_SECONDS)
      PORTITOR_STATUS_LIST_CACHE_SECONDS: "0"
      # where data addresses point: your app, on this machine, fetches the
      # data from there (the consumer reaches the provider as
      # http://provider:8080, the address given when negotiating)
      PORTITOR_PUBLIC_URL: http://127.0.0.1:18080
      # HealthDCAT-AP datasets, checked against the dataspace's bundle
      PORTITOR_DATASETS_FILE: /config/datasets.json
      # the newest version (latest.json), looked for every hour
      PORTITOR_BUNDLE_URL: http://issuer:8070/bundles/
      PORTITOR_BUNDLE_AUTHORITY: did:web:issuer%3A8070
      # the offer for EU processors checks a DataProcessorCredential claim (ADR 0019)
      PORTITOR_POLICY_CREDENTIALS: DataProcessorCredential
      PORTITOR_ALLOW_HTTP: "true"
      # the harvest jobs (GET /v1/harvest-jobs)
      PORTITOR_MANAGEMENT_BIND: 0.0.0.0:8081
      PORTITOR_MANAGEMENT_API_KEY_FILE: /run/secrets/provider-management-key
      # object storage (S3=1): s3:// sources. A demo: in production the
      # keys come from a secret store (docs/DEPLOYING.md)
      AWS_ENDPOINT_URL_S3: http://rustfs:9000
      AWS_ACCESS_KEY_ID: ${DEMO_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${DEMO_S3_SECRET_KEY:-}
    secrets:
      - provider-sts-secret
      - provider-management-key
    volumes:
      # examples/healthdcat-datasets.json, or with S3=1 changed by s3-datasets.jq
      - ./run/datasets.json:/config/datasets.json:ro
      - provider-data:/data
    ports:
      - 127.0.0.1:18080:8080
      - 127.0.0.1:18081:8081
    # the bundle and its own DID document are read at start
    depends_on:
      issuer:
        condition: service_healthy
      provider-identity:
        condition: service_healthy
      data:
        condition: service_started
    # should a start still fail, it is tried again
    restart: on-failure

  # --- the consumer ---------------------------------------------------------

  consumer-identity:
    <<: *identity
    environment:
      PORTITOR_PARTICIPANT_ID: did:web:consumer-identity%3A8090
      PORTITOR_IDENTITY_KEY_FILE: /run/secrets/consumer-identity-key
      PORTITOR_CREDENTIAL_SERVICE_URL: http://consumer-identity:8090/cs
      PORTITOR_STS_CLIENT_SECRET_FILE: /run/secrets/consumer-sts-secret
      PORTITOR_TRUSTED_ISSUERS: did:web:issuer%3A8070
      PORTITOR_MANAGEMENT_BIND: 0.0.0.0:8091
      PORTITOR_MANAGEMENT_API_KEY_FILE: /run/secrets/consumer-identity-management-key
      PORTITOR_ALLOW_HTTP: "true"
    secrets:
      - consumer-identity-key
      - consumer-sts-secret
      - consumer-identity-management-key
    volumes:
      - consumer-identity-data:/data
    ports:
      - 127.0.0.1:18092:8090 # credential service and STS
      - 127.0.0.1:18093:8091 # management API

  consumer:
    <<: *connector
    environment:
      PORTITOR_PARTICIPANT_ID: did:web:consumer-identity%3A8090
      PORTITOR_STS_URL: http://consumer-identity:8090/sts/token
      PORTITOR_STS_CLIENT_SECRET_FILE: /run/secrets/consumer-sts-secret
      PORTITOR_TRUSTED_ISSUERS: did:web:issuer%3A8070
      # status lists fetched on every check, so a revocation in the demo
      # is seen at once (docs/DEPLOYING.md, PORTITOR_STATUS_LIST_CACHE_SECONDS)
      PORTITOR_STATUS_LIST_CACHE_SECONDS: "0"
      PORTITOR_PUBLIC_URL: http://consumer:8080
      PORTITOR_POLICY_CREDENTIALS: DataProcessorCredential
      PORTITOR_ALLOW_HTTP: "true"
      PORTITOR_MANAGEMENT_BIND: 0.0.0.0:8081
      PORTITOR_MANAGEMENT_API_KEY_FILE: /run/secrets/consumer-management-key
      # object storage (S3=1): where pushed data lands
      AWS_ENDPOINT_URL_S3: http://rustfs:9000
      AWS_ACCESS_KEY_ID: ${DEMO_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${DEMO_S3_SECRET_KEY:-}
      PORTITOR_PUSH_BUCKET: ${DEMO_PUSH_BUCKET:-}
    secrets:
      - consumer-sts-secret
      - consumer-management-key
    volumes:
      - consumer-data:/data
    ports:
      - 127.0.0.1:18090:8080
      - 127.0.0.1:18091:8081
    depends_on:
      consumer-identity:
        condition: service_healthy

# written by scenarios/two-party/run.sh; the images run as user 65532, which
# must read them
secrets:
  issuer-key:
    file: ./run/issuer/issuer-key.pem
  issuer-management-key:
    file: ./run/issuer/management.key
  provider-identity-key:
    file: ./run/provider/identity-key.pem
  provider-sts-secret:
    file: ./run/provider/sts-client-secret
  provider-identity-management-key:
    file: ./run/provider/identity-management.key
  provider-management-key:
    file: ./run/provider/management.key
  consumer-identity-key:
    file: ./run/consumer/identity-key.pem
  consumer-sts-secret:
    file: ./run/consumer/sts-client-secret
  consumer-identity-management-key:
    file: ./run/consumer/identity-management.key
  consumer-management-key:
    file: ./run/consumer/management.key

volumes:
  issuer-data:
  provider-identity-data:
  provider-data:
  consumer-identity-data:
  consumer-data:
  rustfs-data:
