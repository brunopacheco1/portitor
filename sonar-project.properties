# SonarQube Cloud (CI-based analysis; Rust needs it)
sonar.organization=brunopacheco1-github
sonar.projectKey=brunopacheco1_portitor
sonar.projectName=Portitor
sonar.sources=crates,scripts
sonar.tests=crates
sonar.test.inclusions=crates/*/tests/**
sonar.exclusions=crates/*/tests/**
# reports written by the CI job before the scan
sonar.rust.clippyReport.reportPaths=clippy-report.json
sonar.rust.lcov.reportPaths=lcov.info
# CI helper scripts are analysed for bugs and security, but not measured for coverage:
# they run in CI, not in the shipped images.
sonar.coverage.exclusions=scripts/**
# S5332 (clear-text HTTP): the scripts only talk to processes they start themselves on
# 127.0.0.1 or a private Docker network (demos, measurements, the EDC interop test), and
# did:web over plain HTTP needs PORTITOR_ALLOW_HTTP, a test-only setting.
# The shipped binaries are still checked for this rule.
sonar.issue.ignore.multicriteria=localhttp,localhttppy,proxyforward,proxylog
sonar.issue.ignore.multicriteria.localhttp.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.localhttp.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.localhttppy.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.localhttppy.resourceKey=scripts/**
# scripts/round-robin-proxy.py is the load balancer of the replica test
# (scenarios/two-party/run-replicas.sh), on 127.0.0.1 only.
# S5144 (server-side request forgery): it forwards each request to a backend fixed on
# its command line, never to a host named in the request; a target that is not a plain
# path is refused with 400. S8707 (path traversal): the log file is named by the test
# script that starts it, not by a request.
sonar.issue.ignore.multicriteria.proxyforward.ruleKey=pythonsecurity:S5144
sonar.issue.ignore.multicriteria.proxyforward.resourceKey=scripts/round-robin-proxy.py
sonar.issue.ignore.multicriteria.proxylog.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.proxylog.resourceKey=scripts/round-robin-proxy.py
