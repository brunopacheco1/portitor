# The Gaia-X end-to-end test's front door (compose.yaml, service "tls"):
# the public names of the services whose did:web the others resolve.
# One server certificate from the run's test CA covers every name.
#
# Port 443: the Gaia-X compliance service resolves did:web over HTTPS only.
# Port 80: Portitor components run with PORTITOR_ALLOW_HTTP_CALLBACKS,
# so they resolve did:web over plain HTTP; both ports serve the same.

# the container's resolver, so a service that is not up yet does not stop nginx
resolver 127.0.0.11 valid=10s;

map $host $backend {
    provider.gaiax.test http://provider-identity:8090;
    consumer.gaiax.test http://consumer-identity:8090;
    compliance.gaiax.test http://compliance:3000;
}

# the participants' identities and the compliance service
server {
    listen 80;
    listen 443 ssl;
    server_name provider.gaiax.test consumer.gaiax.test compliance.gaiax.test;
    ssl_certificate /tls/server.pem;
    ssl_certificate_key /tls/server-key.pem;
    client_max_body_size 1m;

    location / {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# the test notary: its DID document and certificate chain, static files
# written by scripts/gaiax-e2e.sh (scripts/gaiax_test_notary.py)
server {
    listen 80;
    listen 443 ssl;
    server_name notary.gaiax.test;
    ssl_certificate /tls/server.pem;
    ssl_certificate_key /tls/server-key.pem;
    root /notary;
    types {
        application/did+json json;
        application/x-pem-file pem;
    }
}
