# EDC control plane (v1.0.0-RC8) of the EDC interop test. Test-only:
# plain HTTP, a dev Vault, a fixed management API key.

# the participant: its DID document is hosted by the EDC IdentityHub and
# reached under the public name edc.gaiax.test (the "tls" service of
# compose.yaml), which the Gaia-X compliance service needs
edc.participant.id=did:web:edc.gaiax.test
edc.iam.issuer.id=did:web:edc.gaiax.test
edc.iam.did.web.use.https=false

# tokens come from the IdentityHub's STS; the IdentityHub keeps the client
# secret in the shared Vault when it creates the participant
edc.iam.sts.oauth.token.url=http://edc-identityhub:7084/api/sts/token
edc.iam.sts.oauth.client.id=did:web:edc.gaiax.test
edc.iam.sts.oauth.client.secret.alias=edc-sts-client-secret
edc.vault.hashicorp.url=http://vault:8200
edc.vault.hashicorp.token=root

web.http.port=8080
web.http.path=/api
web.http.management.port=8081
web.http.management.path=/api/management
web.http.management.auth.type=tokenbased
web.http.management.auth.key=edc-interop-test-key
web.http.protocol.port=8082
web.http.protocol.path=/api/dsp
web.http.control.port=8083
web.http.control.path=/api/control
web.http.signaling.port=8084
web.http.signaling.path=/api/signaling
edc.dsp.callback.address=http://edc-controlplane:8082/api/dsp

# The scope EDC asks a counter-party's credential service for, and puts in
# its own access tokens. Set explicitly: EDC IdentityHub v1.0.0-RC8 accepts
# only "org.eclipse.dspace.dcp.vc.type:<type>:<read|all|*>"
# (EdcScopeToCriterionTransformer). Portitor's PORTITOR_DCP_SCOPES is the
# same string (compose.yaml).
edc.iam.dcp.scopes.membership.id=membership
edc.iam.dcp.scopes.membership.type=DEFAULT
edc.iam.dcp.scopes.membership.value=org.eclipse.dspace.dcp.vc.type:MembershipCredential:read

# Gaia-X compliance (Portitor's ADR 0022). When a policy EDC sends in a
# contract or transfer request has a constraint whose left operand starts
# with "ParticipantComplianceCredential" (Portitor's offer:
# ParticipantComplianceCredential.gx:labelLevel), EDC adds these two scopes
# to its access token (DynamicScopeExtractor, type POLICY), so the Portitor
# provider may ask the IdentityHub for the compliance credential and the
# legal person credential it names. The values are the scopes Portitor
# asks for (PORTITOR_POLICY_CREDENTIALS in compose.yaml).
edc.iam.dcp.scopes.gaiaxcompliance.id=gaiax-compliance
edc.iam.dcp.scopes.gaiaxcompliance.type=POLICY
edc.iam.dcp.scopes.gaiaxcompliance.prefix.mapping=ParticipantComplianceCredential
edc.iam.dcp.scopes.gaiaxcompliance.value=org.eclipse.dspace.dcp.vc.type:ParticipantComplianceCredential:read
edc.iam.dcp.scopes.gaiaxlegalperson.id=gaiax-legal-person
edc.iam.dcp.scopes.gaiaxlegalperson.type=POLICY
edc.iam.dcp.scopes.gaiaxlegalperson.prefix.mapping=ParticipantComplianceCredential
edc.iam.dcp.scopes.gaiaxlegalperson.value=org.eclipse.dspace.dcp.vc.type:LegalPerson:read

# The InteropTestCredential of the EDC Issuer Service, both ways:
# as consumer, EDC adds this scope to its access token when the policy it
# sends constrains InteropTestCredential.<claim> (Portitor's third offer);
# as provider, it asks the caller's credential service for it when its own
# offer does (the contract definition scripts/edc-interop.sh adds; the
# constraint is checked by runtimes/controlplane, CredentialClaimPolicyExtension).
edc.iam.dcp.scopes.interoptest.id=interop-test
edc.iam.dcp.scopes.interoptest.type=POLICY
edc.iam.dcp.scopes.interoptest.prefix.mapping=InteropTestCredential
edc.iam.dcp.scopes.interoptest.value=org.eclipse.dspace.dcp.vc.type:InteropTestCredential:read

# the data space's two issuers: portitor-issuer issues every
# MembershipCredential, the EDC Issuer Service the InteropTestCredential.
# Without supportedtypes an issuer is trusted for every type, as in Portitor.
# The policy function for InteropTestCredential.level reads
# edc.iam.trustedissuer.edcissuer.id and accepts that credential from this
# issuer only (runtimes/controlplane, CredentialClaimPolicyExtension).
edc.iam.trustedissuer.authority.id=did:web:issuer%3A8070
edc.iam.trustedissuer.edcissuer.id=did:web:edc-issuer.gaiax.test

# read status lists again after a second, so the revocation check sees a
# revocation at once (default: 15 minutes)
edc.iam.credential.revocation.cache.validity=1000
