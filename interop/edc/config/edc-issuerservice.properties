#
# EDC Issuer Service (v1.0.0-RC8, from the IdentityHub project) of the EDC
# interop test: a second issuer in the data space, next to portitor-issuer.
# It issues the InteropTestCredential to both participants (DCP issuance)
# and publishes its status list. In-memory stores. Test-only: plain HTTP, a
# dev Vault.

web.http.port=9080
web.http.path=/api
# participant contexts: the issuer itself is one (scripts/edc-interop.sh)
web.http.identity.port=9081
web.http.identity.path=/api/identity
# the DCP issuer service: {path}/v1/participants/<context>/metadata,
# /credentials and /requests/<id>
web.http.issuance.port=9082
web.http.issuance.path=/api/issuance
# its DID document, reached under the public name edc-issuer.gaiax.test
# (the "tls" service of compose.yaml)
web.http.did.port=9083
web.http.did.path=/
web.http.sts.port=9084
web.http.sts.path=/api/sts
# holders, attestation and credential definitions, revocation
web.http.issueradmin.port=9085
web.http.issueradmin.path=/api/issuer
# the status list credentials, and the address verifiers fetch them from:
# it is written into every credential (credentialStatus.statusListCredential)
web.http.statuslist.port=9086
web.http.statuslist.path=/statuslist
edc.statuslist.callback.address=http://edc-issuerservice:9086/statuslist

# did:web DIDs of the test are served over plain HTTP
edc.iam.did.web.use.https=false

# the issuer's key, its STS secret and the holders' access tokens
edc.vault.hashicorp.url=http://vault:8200
edc.vault.hashicorp.token=root

# The Identity API and the admin API take tokens that
# scripts/edc-interop.sh signs with a test-only RSA key
# (identity_api_token), as the IdentityHub's Identity API does; the scope
# says which API a token is for (identity-api:admin, issuer-admin-api:admin)
edc.iam.oauth2.issuer=edc-interop-admin
edc.iam.oauth2.jwks.url=http://identity-api-jwks/jwks.json

# VC Data Model 2.0 as JWT, with a Bitstring Status List: the DCP profile
# vc20-bssl/jwt, which is also the default
edc.issuer.dcp.profile=vc20-bssl/jwt
# look for new credential requests every 500 ms (default: 1 s)
edc.issuer.issuance.state-machine.iteration-wait-millis=500
