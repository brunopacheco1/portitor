version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # the OpenTelemetry crates are 0.x and change their API together (ADR 0023);
      # first, so the test-only opentelemetry-proto joins them too
      opentelemetry:
        patterns: ['opentelemetry*', 'tracing-opentelemetry']
      # one PR per week for test-only tooling; runtime dependencies stay separate
      test-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    # the CA certificate stage of the release image
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    groups:
      fuzz:
        patterns: ['*']
