# The EDC interop test (docs/TESTING.md): Portitor (connector and identity)
# against EDC v1.0.0-RC8 (control plane, data plane, IdentityHub); both
# ask portitor-issuer for their MembershipCredential. Catalog, negotiation
# and pull transfer both ways, a dataset that asks for Gaia-X compliance
# (gx-compliance, a test notary and a test CA, as in the Gaia-X test), a
# second issuer (the EDC Issuer Service: a test credential issued to both,
# required and checked both ways, then revoked), then revocation by
# portitor-issuer both ways. The EDC runtimes are built from Maven Central
# (scenarios/edc-interop/runtimes); there are no EDC images.
name: EDC interop
# This workflow has a path filter, so it must not be a required check: a
# pull request that does not match would wait for it for ever
# (CONTRIBUTING.md, "Required checks"). The filter lists what the job
# reads; keep it in step with scenarios/edc-interop/run.sh.
on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml" # the release profile, the dependencies' features, the lints
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "scenarios/edc-interop/**" # Compose file, settings, data, and the EDC runtimes (the Issuer Service too)
      - "examples/gaiax/**" # the compliance service and its graph database
      - "examples/bundle/**" # the bundle the issuer serves, signed by scripts/demo-bundle.sh
      - "scripts/demo-bundle.sh"
      - "scripts/container-engine.sh"
      - "scripts/require-bash.sh"
      - "scripts/gaiax-lib.sh"
      - "scripts/gaiax_test_notary.py"
      - "scripts/gaiax_test_onboarding.py"
      - ".github/workflows/edc-interop.yml"
  schedule:
    - cron: "37 2 * * *" # nightly: EDC's side changes without our code changing
  workflow_dispatch:

# Runs of one pull request share a group: a newer push replaces the run in progress.
# Every other run (a push to main, a scheduled or a manual run) is a group of its own,
# named by its run id, so it is never cancelled and never waits for another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: always

jobs:
  edc:
    name: Portitor and EDC
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -t x86_64-unknown-linux-musl
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools python3-cryptography
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the Portitor images (as CI does)
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl -p portitor-connector -p portitor-identity \
            -p portitor-issuer
          mkdir -p dist/amd64
          cp target/x86_64-unknown-linux-musl/release/portitor-{connector,identity,issuer} dist/amd64/
          docker build --target portitor-connector -t portitor-connector:ci .
          docker build --target portitor-identity -t portitor-identity:ci .
          docker build --target portitor-issuer -t portitor-issuer:ci .
      - name: Run the interop test
        env:
          LOGS: edc-interop.log
        run: scenarios/edc-interop/run.sh
      - name: Keep the container logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edc-interop-logs
          path: edc-interop.log
          if-no-files-found: ignore
          retention-days: 7
