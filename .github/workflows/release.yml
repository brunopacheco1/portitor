name: Release
# Pushing a signed tag vX.Y.Z publishes the component images to GHCR, signed, with an SBOM and
# build provenance, and creates a GitHub release. Owner setup and the steps: docs/RELEASING.md.
on:
  push:
    tags: ['v*']
  # a dry run (build, SBOM, image; nothing pushed or signed) when the release process changes
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      # the release pull request sets the version there: so the arm64 build and tests, the SBOMs
      # and the notices run on that pull request, before the tag (docs/RELEASING.md)
      - 'Cargo.toml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/third_party_notices.py'
      - 'scripts/build-release.sh'

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: always
  # One entry per image (ADR 0003), and a build target of the same name in the Dockerfile.
  COMPONENTS: portitor-connector portitor-identity portitor-issuer

jobs:
  verify:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.tag.outputs.version || steps.cargo.outputs.version }}
      # COMPONENTS as a JSON list, for the image jobs' matrix (a matrix cannot read env)
      components: ${{ steps.components.outputs.list }}
    steps:
      # this checkout keeps its (read-only) credentials: the steps below fetch the tag and `main`
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history, to check that the tag is on main
      - name: Component list
        id: components
        run: echo "list=$(jq -cn --arg c "$COMPONENTS" '$c | split(" ")')" >> "$GITHUB_OUTPUT"
      - name: Version from Cargo.toml (dry run)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        id: cargo
      - name: Tag is signed, is on main, matches Cargo.toml and CHANGELOG.md
        if: ${{ github.event_name == 'push' }}
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "$TAG")" != tag ]; then
            echo "::error::$TAG is a lightweight tag; create it with git tag -s"; exit 1
          fi
          # the maintainer's public keys, as published by GitHub (HTTPS only, redirects included)
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL "https://github.com/${GITHUB_REPOSITORY_OWNER}.gpg" | gpg --import
          git verify-tag "$TAG"
          # A guard against mistakes, not a security control: a release is cut from main
          # only, so a signed tag put by mistake on a commit that is not merged (a branch,
          # the head of a pull request before a squash merge) publishes nothing.
          # It cannot stop someone who may push a v* tag on purpose: on a tag push GitHub
          # reads this workflow file from the tagged commit, and that commit can remove
          # this step. The controls are outside this file: the required reviewer of the
          # `release` environment and the tag ruleset for v* (docs/RELEASING.md,
          # "One-time setup").
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "${TAG}^{commit}" refs/remotes/origin/main; then
            echo "::error::$TAG is on commit $(git rev-parse "${TAG}^{commit}"), which is not on main; tag the commit on main (after a squash merge: the squash commit, not the head of the pull request)"; exit 1
          fi
          CARGO_VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.toml has version $CARGO_VERSION, the tag says $VERSION"; exit 1
          fi
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"; exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90 # no Rust cache here: tests and release builds from scratch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -t "${{ matrix.target }}"
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Test
        run: cargo test --workspace --locked
      - name: Build static binaries (reproducible)
        # the same script as the rebuild check (reproducible.yml); it prints the SHA-256 of each binary
        run: scripts/build-release.sh "${{ matrix.target }}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/
          retention-days: 7

  sbom:
    name: SBOMs and third-party notices
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-cyclonedx
      - name: One CycloneDX SBOM per component, and the notices for all of them
        run: |
          cargo cyclonedx --format json --describe binaries --target x86_64-unknown-linux-musl
          mkdir sbom
          boms=()
          for c in $COMPONENTS; do
            cp "crates/$c/${c}_bin.cdx.json" "sbom/$c-$VERSION.cdx.json"
            boms+=("sbom/$c-$VERSION.cdx.json")
          done
          python3 scripts/third_party_notices.py "$VERSION" "${boms[@]}" > sbom/THIRD-PARTY-NOTICES.txt
          wc -l sbom/THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          retention-days: 7

  dry-run:
    name: Image dry run, ${{ matrix.component }} (nothing pushed)
    if: ${{ github.event_name == 'pull_request' }}
    needs: [verify, build]
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.verify.outputs.components) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
      - name: Arrange binaries by architecture
        run: |
          for a in amd64 arm64; do mv "dist/dist-$a" "dist/$a"; done
          chmod +x dist/*/*
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # a pinned BuildKit, so a rebuild writes the same layers (reproducible.yml uses the same)
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Commit time
        id: meta
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - name: Build ${{ matrix.component }} (amd64, arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        with:
          context: .
          target: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          # the release's image output, without the push
          outputs: type=image,name=dry-run/${{ matrix.component }}:${{ env.VERSION }},push=false,rewrite-timestamp=true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}

  images:
    name: Publish ${{ matrix.component }}
    if: ${{ github.event_name == 'push' }}
    needs: [verify, build, sbom]
    strategy:
      # let each image finish (pushed, signed, attested) even if the other fails;
      # the GitHub release is only created when all of them succeeded
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.verify.outputs.components) }}
    runs-on: ubuntu-24.04
    # only these jobs can push and sign; the environment can require the maintainer's approval
    # (one approval covers all images of a run: "Review deployments" lists them together)
    environment: release
    # counts from the start of the job, after the approval; the wait for the approval is not in it
    timeout-minutes: 45
    permissions:
      packages: write # push to GHCR
      id-token: write # keyless signing and attestations
      attestations: write # store provenance and SBOM attestations
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      COMPONENT: ${{ matrix.component }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
      - name: Arrange binaries by architecture
        run: |
          for a in amd64 arm64; do mv "dist/dist-$a" "dist/$a"; done
          chmod +x dist/*/*
          ls -lR dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # a pinned BuildKit, so a rebuild writes the same layers (reproducible.yml uses the same)
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Image creation time and description
        id: meta
        run: |
          # the tagged commit's time, so rebuilds match
          echo "time=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
          # the same time for BuildKit: image config, history and the time of every file in the layers
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          # the description label of this component's target in the Dockerfile, so it is written once
          description=$(sed -n "/^FROM base AS ${COMPONENT}\$/,/^ENTRYPOINT/s/.*image\.description=\"\(.*\)\"\$/\1/p" Dockerfile)
          if [ -z "$description" ]; then
            echo "::error::No image.description label for target $COMPONENT in the Dockerfile"; exit 1
          fi
          echo "description=$description" >> "$GITHUB_OUTPUT"
      - name: Build and push ${{ matrix.component }} (amd64, arm64)
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        with:
          context: .
          target: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          # rewrite-timestamp: every file in the layers gets SOURCE_DATE_EPOCH, so the digest
          # does not depend on when the binaries were downloaded (docs/RELEASING.md,
          # "Reproducible builds"; the rebuild check uses the same inputs)
          outputs: type=image,name=${{ env.IMAGE }}:${{ env.VERSION }},push=true,rewrite-timestamp=true
          provenance: false # provenance is attested below, signed by GitHub
          sbom: false
          # the OCI labels live in the Dockerfile; these fill in the per-release values
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.time }}
          # the same keys on the multi-arch index, which registries such as GHCR display
          annotations: |
            index:org.opencontainers.image.title=${{ matrix.component }}
            index:org.opencontainers.image.description=${{ steps.meta.outputs.description }}
            index:org.opencontainers.image.licenses=Apache-2.0
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.version=${{ env.VERSION }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.created=${{ steps.meta.outputs.time }}
      - name: Sign the image (cosign, keyless)
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: SBOM attestation
        # actions/attest replaces the deprecated actions/attest-sbom (same inputs);
        # the header size setting is the one attest-sbom passed to it
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: '--max-http-header-size=32768'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: sbom/${{ matrix.component }}-${{ env.VERSION }}.cdx.json
          push-to-registry: true
      - name: Keep the digest and the provenance bundle for the release
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          mkdir image
          echo "$DIGEST" > "image/$COMPONENT.digest"
          # the signed provenance bundle (Sigstore, SLSA v1), so it can be verified offline and found
          # by tools such as the OpenSSF Scorecard
          cp "$BUNDLE" "image/$COMPONENT-$VERSION.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.component }}
          path: image/
          retention-days: 7

  release:
    name: GitHub release
    if: ${{ github.event_name == 'push' }}
    # runs only after every image was pushed, signed and attested (and so approved in `release`)
    needs: [verify, build, sbom, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub release
      id-token: write # keyless signing of the binaries' provenance
      attestations: write # store the binaries' provenance
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      # the release is created through the API with GH_TOKEN, not with git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: image
          merge-multiple: true
      # signs the six binaries: a Sigstore-signed SLSA provenance per binary, stored by GitHub
      # (check with `gh attestation verify`, docs/RELEASING.md, "Checking a release")
      - name: Binaries' provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/dist-*/portitor-*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release notes: this version's section of the changelog, then the images
          awk -v v="## [${VERSION}]" 'index($0, v) == 1 {on = 1; next} /^## \[/ || /^\[[^]]*\]: / {on = 0} on' CHANGELOG.md > notes.md
          {
            echo
            echo "Images:"
            for c in $COMPONENTS; do
              echo "- \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/$c:${VERSION}\` (\`$(cat "image/$c.digest")\`)"
            done
            echo
            echo "Verify them as described in docs/RELEASING.md."
          } >> notes.md
          files=(sbom/THIRD-PARTY-NOTICES.txt)
          for a in amd64 arm64; do
            for c in $COMPONENTS; do
              cp "dist/dist-$a/$c" "$c-$VERSION-linux-$a"
              files+=("$c-$VERSION-linux-$a")
            done
          done
          for c in $COMPONENTS; do
            files+=("sbom/$c-$VERSION.cdx.json" "image/$c-$VERSION.intoto.jsonl")
          done
          # a version with a pre-release part (1.0.0-rc.1) is a GitHub pre-release: it never
          # becomes the "latest" release, so the last stable release stays the one shown first
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "Portitor ${VERSION}" \
            "${prerelease[@]}" --notes-file notes.md "${files[@]}"
