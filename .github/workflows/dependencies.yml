name: Dependencies
# GitHub reads Cargo.lock itself, so its dependency graph already holds the full
# (transitive) tree; no submission job is needed, unlike Maven projects.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1' # new advisories appear without code changes

# Runs of one pull request share a group: a newer push replaces the run in progress.
# Every other run (a push to main, a scheduled or a manual run) is a group of its own,
# named by its run id, so it is never cancelled and never waits for another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# How the jobs are chosen: `changes` reads the changed files
# (scripts/ci_changes.sh). On a pull request and on a push the jobs are
# skipped when the change is prose only (no manifest, lock file or policy
# changed; a fuzzing change still runs them). The weekly run always runs
# them. `gate` is the check to require, if cargo-deny and cargo-vet are to
# block a merge (CONTRIBUTING.md, "Required checks").
jobs:
  changes:
    name: Changes
    uses: ./.github/workflows/changes.yml

  review:
    name: Dependency review
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # summary comment on failure
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # block pull requests that add a vulnerable runtime dependency
          fail-on-severity: moderate
          fail-on-scopes: runtime
          # licences are checked by cargo-deny below, against deny.toml
          license-check: false
          show-patched-versions: true
          comment-summary-in-pr: on-failure

  deny:
    name: Licences, advisories and sources (cargo-deny)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check licenses bans sources advisories

  vet:
    name: Every crate audited or exempted (cargo-vet)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-vet@0.10.3
      # --locked: check against the audits pinned in supply-chain/imports.lock (no newer ones fetched).
      # A new or bumped crate fails here until a maintainer audits it (cargo vet certify)
      # or exempts it with a reason; see CONTRIBUTING.md, "Dependency audits (cargo-vet)".
      - name: cargo vet
        run: cargo vet --locked

  # a called workflow: `timeout-minutes` cannot be set here, its jobs keep their own limits
  vulnerabilities:
    name: Known vulnerabilities (OSV)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      scan-args: |-
        -L Cargo.lock
      # advisory: findings go to Security > Code scanning; cargo-deny blocks on RustSec advisories
      fail-on-vuln: false

  # It always runs. It fails when `review`, `deny` or `vet` failed or was
  # cancelled, when `changes` did not succeed, and when one of them was
  # skipped although the change needed it. It passes when they were skipped
  # on purpose (prose only). `vulnerabilities` is advisory and not part of it.
  gate:
    name: Dependencies gate
    if: ${{ always() }}
    needs: [changes, review, deny, vet]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed, or was skipped on purpose
        env:
          NEEDS: ${{ toJSON(needs) }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e '.changes.result == "success"' <<< "$NEEDS" > /dev/null ||
            { echo "::error::the changes job did not succeed"; exit 1; }
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null ||
            { echo "::error::a job failed or was cancelled"; exit 1; }
          if jq -e '.changes.outputs.code != "false"' <<< "$NEEDS" > /dev/null; then
            jq -e '.deny.result == "success" and .vet.result == "success"' <<< "$NEEDS" > /dev/null ||
              { echo "::error::the change needs cargo-deny and cargo-vet, and one of them was skipped"; exit 1; }
            # the dependency review exists on pull requests only
            if [[ $IS_PULL_REQUEST == true ]]; then
              jq -e '.review.result == "success"' <<< "$NEEDS" > /dev/null ||
                { echo "::error::the change needs the dependency review, and it was skipped"; exit 1; }
            fi
          fi
