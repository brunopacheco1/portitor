name: ORT
# The scan is about dependencies and licences, so only manifests and ORT's own config matter.
# The same paths for both events: a merge that changes none of them leaves the reports of `main`
# as they are. With a path filter, this workflow must not be a required check.
on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.ort.yml'
      - '.github/workflows/ort.yml'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.ort.yml'
      - '.github/workflows/ort.yml'

# Runs of one pull request share a group: a newer push replaces the run in progress.
# Every other run (a push to main, a scheduled or a manual run) is a group of its own,
# named by its run id, so it is never cancelled and never waits for another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ort:
    name: OSS Review Toolkit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run GitHub Action for ORT
        uses: oss-review-toolkit/ort-ci-github-action@086d928d24ef1653dc0777296b312fda5faaaf52 # v1.2.0
        with:
          # the evaluator applies ORT's policy rules (copyleft and unclassified licences ...);
          # excludes in .ort.yml keep it to what is shipped
          fail-on: 'violations'
          # PlainTextTemplate is the attribution (NOTICE) report
          report-formats: 'CycloneDx,SpdxDocument,WebApp,PlainTextTemplate'
          run: >
            cache-dependencies,
            labels,
            analyzer,
            evaluator,
            reporter,
            upload-results
